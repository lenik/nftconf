# Demo lab config for docker compose (see demo/docker-compose.yml).
#
#   docker compose -f demo/docker-compose.yml up -d --build
#   docker compose -f demo/docker-compose.yml exec client /demo/scripts/smoke-test.sh
#
# Contexts below use addresses (stable across ethN renumbering).
# Entrypoint may rewrite interface lines from live `ip` if present.

table demo
priority filter

# Outgoing policy is included before interface so it is not bound to a NIC.
include conf.d/outgoing.conf

# --- external NIC / public VIP (ext net 10.66.10.0/24) ---
# Match packets to gw's ext address; DNAT to app on int net.
interface eth0
address 10.66.10.2
dest address 10.66.20.10

include conf.d/nat.conf
include conf.d/whitelist.conf

# --- management NIC scope (mgmt net 10.66.30.0/24) ---
# Different address/interface → separate shield/whitelist membership.
interface eth2
address 10.66.30.2

include conf.d/mgmt.conf
