# Shield INPUT on the current context (ext VIP).
# NAT does not open INPUT — list host-delivery ports explicitly.
#
# TCP/UDP port specs: a port, a range, or a list, e.g.
#   whitelist tcp 80 443 1080 8000-8080

shield on

# Host services on the gateway itself (INPUT)
whitelist tcp 2222      # fake ssh (demo listener on gw)
whitelist tcp 9090      # local status

# Note: DNATed 8080/8443 are FORWARD/prerouting — not listed here on purpose.
